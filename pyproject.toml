[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[project]
name = "chipmunk-dashboard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "plotly<7",
    "pandas",
    "numpy",
    "labdata[dashboard]>=0.1.12",
    # Newer setuptools releases break the real labdata/datajoint import path.
    "setuptools==79.0.1",
]

[project.scripts]
chipmunk-dashboard = "chipmunk_dashboard.cli:main"

[tool.uv.build-backend]
module-root = "src"
source-exclude = [".mypy_cache"]

[tool.uv]
constraint-dependencies = [
    "cryptography>=48.0.1",
    "idna>=3.15",
]

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "pre-commit>=4.6.0",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
    "playwright>=1.60.0",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "streamlit>=1.56,<2",
]

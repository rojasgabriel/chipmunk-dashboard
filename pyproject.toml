[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[project]
name = "chipmunk-dashboard"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "plotly<7",
    "pandas",
    "numpy",
    "labdata[dashboard]>=0.1.15",
    # DataJoint 0.14.x still imports pkg_resources (removed in setuptools 82+;
    # setuptools 81 already warns to pin <81). GHSA-h35f-9h28-mq5c needs
    # setuptools>=83 and cannot be fixed until the lab migrates off DataJoint
    # 0.14.x / schema-breaking DataJoint 2.x.
    "setuptools>=83.0.0,<84",
]

[project.scripts]
chipmunk-dashboard = "chipmunk_dashboard.cli:main"

[tool.uv.build-backend]
module-root = "src"
source-exclude = [".mypy_cache"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
# labdata registers the chipmunk plugin during import.
force-to-top = ["labdata", "labdata.schema"]

[tool.uv]
constraint-dependencies = [
    # Keep DataJoint on the schema-compatible 0.14 line used by the lab DB.
    # Newer DataJoint (2.x) drops the setuptools pin and would be selected if
    # setuptools were forced to >=83 without this bound.
    "datajoint>=0.14.8,<0.15",
    "cryptography>=50.0.0",
    "gitpython>=3.1.58",
    "idna>=3.15",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "pre-commit>=4.6.1",
    "pytest>=9.1.0",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
    "playwright>=1.62.0",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "streamlit>=1.61.1,<2",
]
